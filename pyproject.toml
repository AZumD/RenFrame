[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renframe"
version = "0.1.0"
description = "Inspect Ren'Py games and prepare native Linux ARM64 (Steam Frame) builds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RenFrame contributors" }]
keywords = ["renpy", "arm64", "steam-frame", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
renframe = "renframe.cli:main"

[tool.setuptools.packages.find]
include = ["renframe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
