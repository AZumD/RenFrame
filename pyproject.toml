[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renframe"
version = "0.1.0"
description = "Convert Ren'Py PC builds to native Linux ARM64 for Steam Frame."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "RenFrame contributors" }]
keywords = ["renpy", "arm64", "steam-frame", "linux", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["customtkinter>=5.2.2", "tkinterdnd2>=0.4.2"]
build = ["pyinstaller>=6.3.0"]

[project.scripts]
renframe = "renframe.cli:main"
renframe-library = "renframe.library_manager:main"

[tool.setuptools.packages.find]
include = ["renframe*", "renpy_arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
